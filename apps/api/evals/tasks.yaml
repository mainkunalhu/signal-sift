# SignalSift eval set: 30 research tasks across 4 categories.
# Fields: id, category (factual|comparison|contested|longtail), query, notes.
# Rubric: faithfulness (held-out 120b judge over supported claims),
# citation precision (paragraph coverage), p50/p95 latency.

